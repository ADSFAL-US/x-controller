# Конфигурация 3x-ui панелей
# Добавьте свои панели в список

panels:
  - name: panel-1
    # Базовый хост без путей (без секретного пути панели)
    host: http://localhost:2053
    # Секретный путь к панели (если панель защищена подпутем, например /F3cpGfVrFucX4pkB7z)
    panel_path: ''
    # Путь к подписке относительно корня (например /sub или /avava-vpn)
    sub_path: /sub
    username: admin
    password: admin
    priority: 1
    max_clients: 100
    # true = existing 2.9.x API; omitted legacy also defaults to true
    legacy: true

  # Пример второй панели с секретным путем и кастомной подпиской:
  # - name: panel-2
  #   host: https://2.26.20.199:49238          # API панели (секретный путь)
  #   panel_path: /F3cpGfVrFucX4pkB7z          # Путь к панели
  #   sub_host: https://2.26.20.199:8080       # Отдельный хост для подписок (опционально)
  #   sub_path: /avava-vpn                     # Путь к подписке
  #   username: admin
  #   password: secret
  #   priority: 2
  #   max_clients: 200

  # Modern 3x-ui (v3.1.0+): clients are managed through the clients API.
  # Create an API token in Settings > Security > API Tokens and keep it secret.
  # - name: modern-panel
  #   host: https://panel.example.com:2053
  #   panel_path: /your-panel-path
  #   sub_host: https://sub.example.com:2096
  #   sub_path: /your-configured-sub-path
  #   legacy: false
  #   api_token: replace-with-panel-api-token
  #   priority: 1
  #   max_clients: 200
